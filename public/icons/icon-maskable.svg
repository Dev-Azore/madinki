<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A34" />
      <stop offset="100%" stop-color="#040e1e" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner safe area content -->
  <circle cx="256" cy="256" r="170" fill="#040e1e" stroke="#2e7d32" stroke-width="4" stroke-opacity="0.5" />

  <g transform="translate(256, 240) scale(2.0) translate(-24, -24)">
    <circle cx="10" cy="38" r="6" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" />
    <circle cx="38" cy="38" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M14 34 L38 10" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M34 34 L10 10" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="24" cy="24" r="2.5" fill="#fde047" stroke="#040e1e" stroke-width="1" />
  </g>

  <!-- Bottom Tape Indicator -->
  <path d="M 160 380 A 130 130 0 0 0 352 380" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="10 5" stroke-linecap="round" />
</svg>
