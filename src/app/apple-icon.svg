<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A34" />
      <stop offset="50%" stop-color="#040e1e" />
      <stop offset="100%" stop-color="#02070f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="#2e7d32" fill-opacity="0.12" filter="url(#glow)" />

  <g transform="translate(256, 256) scale(1.6) translate(-24, -24)">
    <circle cx="10" cy="38" r="6" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" />
    <circle cx="38" cy="38" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M14 34 L38 10" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M34 34 L10 10" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="24" cy="24" r="2.5" fill="#fde047" stroke="#040e1e" stroke-width="1" />
  </g>

  <path d="M 128 390 A 160 160 0 0 0 384 390" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 6" stroke-linecap="round" opacity="0.85" />
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">TAILOR<tspan fill="#81c784">APP</tspan></text>
</svg>
